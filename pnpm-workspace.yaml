packages:
  - .

nodeLinker: hoisted

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
  unrs-resolver: true

overrides:
  "@electron/rebuild": 4.0.1

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - fs-xattr
  - macos-alias
  - sharp
  - esbuild
  - unrs-resolver
