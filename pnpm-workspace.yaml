packages:
  - .

nodeLinker: hoisted

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: set this to true or false
  macos-alias: set this to true or false
  sharp: true
  unrs-resolver: true

overrides:
  "@electron/rebuild": 4.0.1

onlyBuiltDependencies:
  - electron
  - electron-winstaller
