name: Build Installers

on:
  workflow_dispatch:
  push:
    branches: ["codex/publish-workbench"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: windows-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            windows-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build Windows installer
        run: pnpm make:win
      - name: Publish Windows installer to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Recurse out/make/squirrel.windows/x64/*Setup.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到 Windows Setup.exe" }
          Write-Host "Found installer: $($exe.FullName)"
          $tag = "latest"
          gh release delete $tag --yes 2>$null
          gh release create $tag $exe.FullName --title "AI服装工作台（最新构建）" --notes "Windows 安装包 + macOS 包，由 GitHub Actions 自动构建。" 2>&1 | Out-String

  macos-x64:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build macOS app
        run: pnpm make:mac
      - name: Publish macOS package to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(find out/make -name '*.zip' | head -1)
          if [ -z "$zip" ]; then echo "未找到 macOS zip，尝试 dmg"; zip=$(find out/make -name '*.dmg' | head -1); fi
          if [ -z "$zip" ]; then echo "未找到任何 macOS 安装包"; ls -R out/make; exit 1; fi
          echo "Found package: $zip"
          gh release upload latest "$zip" --clobber
