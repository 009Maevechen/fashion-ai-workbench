name: Build Installers

on:
  workflow_dispatch:
  push:
    branches: ["codex/publish-workbench"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: windows-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            windows-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build Windows installer
        run: pnpm make:win
      - name: Publish Windows installer to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Recurse out/make/squirrel.windows/x64/*Setup.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到 Windows Setup.exe" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "AI-Workbench-Windows-x64-v$version-Setup.exe"
          Copy-Item $exe.FullName $name
          $checksum = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$checksum  $name" | Set-Content "$name.sha256" -Encoding ascii
          Write-Host "Publishing: $name"
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "AI服装工作台（最新构建）" --notes "Windows 专用安装包，由 GitHub Actions 在 Windows 环境完成检查和构建。"
          }
          gh release upload latest $name "$name.sha256" --clobber
