name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build Windows installer
        run: pnpm make:win
      - name: Collect build logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          Get-ChildItem -Recurse out -ErrorAction SilentlyContinue | Select-Object FullName,Length | Out-File build-logs/artifacts.txt
      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: ai-fashion-workbench-windows-x64
          path: out/make/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-fashion-workbench-windows-build-logs
          path: build-logs
